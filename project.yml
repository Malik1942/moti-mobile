name: Moti
options:
  bundleIdPrefix: com.malik
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    SWIFT_VERSION: "5.0"
    SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Moti:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Moti
      - path: MotiShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malik.Moti
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Moti
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Moti needs calendar access to sync scheduled work items to your calendar.
        INFOPLIST_KEY_NSCalendarsUsageDescription: Moti needs calendar access to sync scheduled work items to your calendar.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Moti uses the microphone so you can capture work items by voice.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: Moti uses speech recognition to turn your spoken captures into text.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Moti/Moti.entitlements
    dependencies:
      - target: MotiWidget
        embed: true
      - sdk: WidgetKit.framework

  MotiWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: MotiWidget
      - path: MotiShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.malik.Moti.MotiWidget
        INFOPLIST_FILE: MotiWidget/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: MotiWidget
        SKIP_INSTALL: YES
        CODE_SIGN_ENTITLEMENTS: MotiWidget/MotiWidget.entitlements
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

schemes:
  Moti:
    build:
      targets:
        Moti: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  MotiWidget:
    build:
      targets:
        MotiWidget: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
